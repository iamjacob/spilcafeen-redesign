<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bf171c">
  <title>Spilcaféen | Find dit næste spil</title>
  <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Spring til indhold</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./index.html" aria-label="Spilcaféen, gå til forsiden"><img src="./assets/img/logo.webp" width="50" height="50" alt=""></a>
      <form class="search-form" role="search">
        <label class="sr-only" for="search-input">Søg efter spil</label><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Søg spil i Spilcaféen..." autocomplete="off">
      </form>
      <button class="menu-button" id="filter-button" type="button" aria-haspopup="dialog" aria-controls="filter-dialog"><span class="sr-only">Åbn filtre</span><span aria-hidden="true" class="menu-icon"><i></i><i></i><i></i></span></button>
    </div>
  </header>
  <main id="main-content" class="page-content">
    <div class="content-heading"><p id="result-count" class="result-count" aria-live="polite"></p></div>
    <div id="active-filters" class="active-filters" aria-label="Aktive filtre"></div>
    <div id="results" class="game-sections" aria-live="polite"></div>
  </main>
  <dialog id="filter-dialog" class="filter-dialog" aria-labelledby="filter-title">
    <form method="dialog" class="filter-panel" id="filter-form">
      <div class="filter-header"><h2 id="filter-title">Filtre</h2><button class="close-button" value="cancel" type="submit" aria-label="Luk filtre">&times;</button></div>
      <fieldset><legend>Sted</legend><div class="choice-list">
        <label><input type="radio" name="location" value="alle" checked><span>Alle</span></label><label><input type="radio" name="location" value="aalborg"><span>Aalborg</span></label><label><input type="radio" name="location" value="kolding"><span>Kolding</span></label><label><input type="radio" name="location" value="aarhus-vestergade"><span>Aarhus Vestergade</span></label><label><input type="radio" name="location" value="aarhus-fredensgade"><span>Aarhus Fredensgade</span></label>
      </div></fieldset>
      <fieldset><legend>Antal spillere</legend><div class="choice-list choice-list--compact">
        <label><input type="radio" name="players" value="alle" checked><span>Alle</span></label><label><input type="radio" name="players" value="2"><span>2</span></label><label><input type="radio" name="players" value="4"><span>4</span></label><label><input type="radio" name="players" value="6"><span>6</span></label><label><input type="radio" name="players" value="8"><span>8</span></label><label><input type="radio" name="players" value="10"><span>10</span></label>
      </div></fieldset>
      <fieldset><legend>Genre</legend><div class="choice-list" aria-describedby="genre-help">
        <p id="genre-help" class="choice-help">Vælg en eller flere genrer.</p>
        <label><input type="checkbox" name="genre" value="alle" checked><span>Alle</span></label><label><input type="checkbox" name="genre" value="Familie"><span>Familiespil</span></label><label><input type="checkbox" name="genre" value="Quiz"><span>Quiz</span></label><label><input type="checkbox" name="genre" value="Strategi"><span>Strategi</span></label><label><input type="checkbox" name="genre" value="Terning"><span>Terninger</span></label><label><input type="checkbox" name="genre" value="Kortspil"><span>Kortspil</span></label>
      </div></fieldset>
      <fieldset><legend>Sværhedsgrad</legend><div class="choice-list">
        <label><input type="radio" name="difficulty" value="alle" checked><span>Alle</span></label><label><input type="radio" name="difficulty" value="Let"><span>Let</span></label><label><input type="radio" name="difficulty" value="Mellem"><span>Mellem</span></label><label><input type="radio" name="difficulty" value="Svær"><span>Svær</span></label>
      </div></fieldset>
      <fieldset><legend>Spilletid</legend><div class="choice-list">
        <label><input type="radio" name="time" value="alle" checked><span>Alle</span></label><label><input type="radio" name="time" value="20"><span>Maks 20 min.</span></label><label><input type="radio" name="time" value="30"><span>Maks 30 min.</span></label><label><input type="radio" name="time" value="60"><span>Maks 60 min.</span></label><label><input type="radio" name="time" value="120"><span>Maks 120 min.</span></label>
      </div></fieldset>
      <button class="reset-button" id="reset-filters" type="button">Nulstil filtre</button>
    </form>
  </dialog>
  <dialog id="game-dialog" class="game-dialog" aria-labelledby="game-title"><article id="game-detail" class="game-detail"></article></dialog>
  <script src="./js/app.js" defer></script>
</body>
</html>
